appId: io.github.noahhhx.mimos.debug
---
- runFlow: subflows/signed-in.yaml
- tapOn: Recipes
- assertVisible: My recipes.*
- assertVisible: No personal recipes yet.*
- takeScreenshot: recipes-mine-empty
- tapOn: Library.*
- scrollUntilVisible:
    element: Greek Salad
- takeScreenshot: recipes-library
- tapOn: Greek Salad
- assertVisible: Library recipe · .*
- assertVisible: Public page
- scrollUntilVisible:
    element: feta
- tapOn: feta
- assertVisible:
    checked: true
    containsChild: feta
- takeScreenshot: cooking-greek-salad
- tapOn: Method · \d+
- scrollUntilVisible:
    element: .*Lay the feta on top.*
- tapOn: .*Lay the feta on top.*
- assertVisible:
    checked: true
    containsChild: .*Lay the feta on top.*
- takeScreenshot: cooking-greek-salad-method
- back
- scrollUntilVisible:
    element: Greek Salad
- tapOn: Greek Salad
- tapOn: Ingredients · \d+
- scrollUntilVisible:
    element: feta
- assertVisible:
    checked: true
    containsChild: feta
- tapOn: Method · \d+
- scrollUntilVisible:
    element: .*Lay the feta on top.*
- assertVisible:
    checked: true
    containsChild: .*Lay the feta on top.*
- takeScreenshot: cooking-greek-salad-again
