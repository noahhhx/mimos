appId: io.github.noahhhx.mimos.debug
---
- runFlow: subflows/signed-in.yaml
- tapOn: Log
- assertVisible: Today
- assertVisible: Nothing logged.*
- takeScreenshot: log-empty
- tapOn: Previous day
- assertVisible: Yesterday
- tapOn: Next day
- assertVisible: Today
- tapOn: \+ Log something else
- assertVisible: Cancel
- tapOn: What
- inputText: suga
- tapOn: Ingredient · .* per 100 g
- scrollUntilVisible:
    element: Comes to .* kcal.*
    centerElement: true
- tapOn: Amount
- eraseText
- inputText: "15"
- hideKeyboard
- scrollUntilVisible:
    element: Comes to .* kcal, 0 g protein, 15 g carbs, 0 g fat\.
    centerElement: true
- takeScreenshot: log-sheet
- scrollUntilVisible:
    element: Log meal
    centerElement: true
- tapOn: Log meal
- assertNotVisible: Cancel
- assertVisible: Sugar, 15 g
- assertVisible: Delete Sugar, 15 g
- takeScreenshot: log-ingredient
- tapOn: \+ Log something else
- tapOn: What
- inputText: Toast with jam
- hideKeyboard
- tapOn: Calories
- inputText: "310"
- hideKeyboard
- scrollUntilVisible:
    element: Log meal
    centerElement: true
- tapOn: Log meal
- assertVisible: Delete Toast with jam
- assertVisible: 310 kcal
- takeScreenshot: log-custom
- tapOn: Delete Toast with jam
- assertNotVisible: Delete Toast with jam
- assertVisible: Delete Sugar, 15 g
- tapOn: Week totals →
- assertVisible: Tap a day to see its meals\.
- takeScreenshot: log-week
- tapOn: ".*: \\d+ kcal, 0 g protein, 15 g carbs, 0 g fat"
- assertNotVisible: Tap a day to see its meals\.
- assertVisible: Delete Sugar, 15 g
- tapOn: Toggle light and dark mode
- takeScreenshot: log-dark
- tapOn: Toggle light and dark mode
