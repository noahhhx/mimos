appId: io.github.noahhhx.mimos.debug
---
- runFlow: connect-and-sign-in.yaml
- tapOn: Log
- assertVisible: Week of .*
- assertVisible: This week, per day
- takeScreenshot: log-empty
- scrollUntilVisible:
    element: Nothing logged.*
- scrollUntilVisible:
    element: Log something else
    centerElement: true
- tapOn: What
- inputText: suga
- tapOn: Ingredient · .* per 100 g
- assertVisible: Comes to .* kcal.*
- tapOn: Amount
- eraseText
- inputText: "15"
- hideKeyboard
- assertVisible: Comes to .* kcal, 0 g protein, 15 g carbs, 0 g fat\.
- tapOn: Log meal
- scrollUntilVisible:
    element: Sugar, 15 g
    direction: UP
- assertVisible: Delete Sugar, 15 g
- takeScreenshot: log-ingredient
- scrollUntilVisible:
    element: What
    centerElement: true
- tapOn: What
- inputText: Toast with jam
- hideKeyboard
- tapOn: Calories
- inputText: "310"
- hideKeyboard
- scrollUntilVisible:
    element: Log meal
    centerElement: true
- tapOn: Log meal
- scrollUntilVisible:
    element: Delete Toast with jam
    direction: UP
    centerElement: true
- assertVisible: 310 kcal
- takeScreenshot: log-custom
- tapOn: Delete Toast with jam
- assertNotVisible: Delete Toast with jam
- assertVisible: Delete Sugar, 15 g
- scrollUntilVisible:
    element: This week, per day
    direction: UP
- tapOn: Toggle light and dark mode
