spring:
  application:
    name: mimos-api
  profiles:
    default: local
  flyway:
    enabled: true

mimos:
  library:
    # Curated library seed (roadmap step 11): idempotent on restart, so
    # content fixes ship with a restart. Set false for an empty library.
    seed-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from the local compose stack. Inside compose the
          # container resolves the JWKS via the internal host (see
          # deploy/docker/compose.yml) while still validating this issuer.
          issuer-uri: http://localhost:8081/realms/mimos

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
