site_name: Mimos
site_description: >-
  The Mimos user guide: a free recipe library, your own recipes, meal
  planning, shopping lists, and a food log. Use it, or host it yourself.
site_url: https://noahhhx.github.io/mimos/
repo_url: https://github.com/noahhhx/mimos
repo_name: noahhhx/mimos
edit_uri: edit/main/docs/
copyright: Mimos is free software under the GNU GPL v3.

# The site wears the app's Evening Kitchen design (docs/design/index.md,
# "Documentation site"): the styling is extra_css over Material's stock
# templates, with no template overrides or hooks, so it builds the same
# under Zensical's classic variant.
theme:
  name: material
  # Fonts are the app's committed files (docs/assets/fonts links to them);
  # no request goes to Google Fonts.
  font: false
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  # Light by default; dark only when chosen with the toggle. No `media`
  # queries, so the OS setting is not followed (ADR-0008).
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/circle-half-full
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/circle-half-full
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/mimos.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# The site is the user guide: using Mimos, self-hosting it, and writing
# plugins. Contributor docs (design, agent harness, ADRs) stay in docs/ for
# the repo but are not published; link to them on GitHub from site pages.
exclude_docs: |
  /design/
  /harness/
  /decisions/
  /requirements.txt

nav:
  - Home: index.md
  - Using Mimos:
      - guide/index.md
      - Recipes: guide/recipes.md
      - Planning a week: guide/planning.md
      - Shopping list: guide/shopping-list.md
      - Food log: guide/log.md
      - Plugins: guide/plugins.md
      - AI agents: guide/agents.md
      - Your data: guide/your-data.md
  - Self-hosting: self-hosting.md
  - Writing a plugin:
      - plugins/index.md
      - Country of the Week: plugins/country-week.md
