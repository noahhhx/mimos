# Mimos API contract — the source of truth for the HTTP surface.
#
# Server stubs (apps/api, generated at build time) and the TypeScript client
# (libraries/api-client, generated on demand + verified in CI) are both
# derived from this file. Hand-edit generated code and the build or the CI
# drift check will fail; change the spec instead. See docs/decisions/ADR-0003.
#
# The MCP server at /mcp (ADR-0014) serves every operation under /api/v1/
# as an agent tool, named by its operationId and described by its summary
# and description, so write those for an agent that has only this text to
# go on. A new endpoint is a tool automatically; an operation opts out with
# the vendor extension `x-mcp: false`.
openapi: 3.1.0
info:
  title: Mimos API
  version: 0.11.0
  description: |
    The Mimos recipe companion API. Endpoints require a bearer token issued
    by the instance's Keycloak realm unless they live under `/api/v1/public`
    (read-only library access for SEO pages); failures are reported as
    RFC 9457 problem-details.

    Every response carries an `X-Request-Id` header. Clients may send their
    own (1–64 characters from `A-Z a-z 0-9 . _ -`) to correlate a call with
    the server's logs; otherwise, or when it is malformed, one is generated.
paths:
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The authenticated user's own profile
      description: >
        Returns the profile of the authenticated user, creating it on first
        request (keyed by the OIDC subject).
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /api/v1/me/plugins:
    get:
      tags: [plugin-settings]
      operationId: listMyPlugins
      summary: The instance's plugins and whether the caller turned each on
      description: >
        Plugins are opt-in per user (ADR-0013): a plugin receives a user's
        plan context, and contributes suggestions to it, only after that
        user turns it on. Lists the instance's available plugins in
        registration order; a plugin that is unreachable is left out until
        it answers again.
      responses:
        '200':
          description: The available plugins, each with the caller's choice.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPlugin'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/me/plugins/{pluginId}:
    parameters:
      - name: pluginId
        in: path
        required: true
        description: The plugin's manifest id.
        schema:
          type: string
    put:
      tags: [plugin-settings]
      operationId: updateMyPlugin
      summary: Turn a plugin on or off for the caller
      description: >
        Turning a plugin on needs it to be available on the instance (404
        otherwise). Turning one off always succeeds, so a choice can be
        withdrawn even while the plugin is unreachable or after it was
        removed from the instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPluginSetting'
      responses:
        '204':
          description: The choice is saved.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/household:
    get:
      tags: [household]
      operationId: getHousehold
      summary: The caller's household and who is in it
      description: >
        Every user belongs to exactly one household (ADR-0019); a user on
        their own is a household of one. The household shares its recipes,
        personal ingredients, meal plans, shopping lists, and plugin
        choices; each member's meal log stays their own. Members are listed
        by name, and `you` marks the caller.
      responses:
        '200':
          description: The caller's household.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/household/invites:
    post:
      tags: [household]
      operationId: createHouseholdInvite
      summary: Invite someone to the caller's household
      description: >
        Creates an invite to the caller's household. Any member may create
        one. The token is returned only here: give the person the link
        `/app/join/{token}` on this Mimos. It works once, for seven days.
        Joining is something the invited person confirms themselves in the
        web app.
      responses:
        '201':
          description: The invite, with its one-time token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvite'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/household/invites/preview:
    post:
      tags: [household]
      operationId: previewHouseholdInvite
      x-mcp: false
      summary: What joining with an invite would mean for the caller
      description: >
        Reads an invite without using it, for the page that asks the caller
        to confirm: who is in the inviting household, when the invite
        expires, whether the caller is already a member, and whether the
        caller's current household is shared. The token travels in the body
        so it stays out of request logs. An unknown token is a 404; an
        expired or used one is a 410.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdInviteToken'
      responses:
        '200':
          description: The invite's household and what joining would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdInvitePreview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'

  /api/v1/household/join:
    post:
      tags: [household]
      operationId: joinHousehold
      x-mcp: false
      summary: Join a household with an invite
      description: >
        Uses the invite and moves the caller into its household. From a
        household of one, the caller's recipes and personal ingredients
        come along; their meal plans, shopping lists, and plugin choices are
        deleted. From a shared household, the caller leaves it first (see
        leaveHousehold) and brings nothing. The caller's meal log stays
        theirs either way. An unknown invite is a 404, an expired or used
        one a 410, and an invite to the caller's own household a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdInviteToken'
      responses:
        '200':
          description: The household the caller is now in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'

  /api/v1/household/leave:
    post:
      tags: [household]
      operationId: leaveHousehold
      x-mcp: false
      summary: Leave the caller's shared household
      description: >
        The caller leaves and starts a new household of one. The household
        keeps its recipes, ingredients, meal plans, and shopping lists. The
        caller stops eating every planned meal there, and a meal nobody else
        eats is removed. The caller keeps their meal log, but logged meals
        no longer link to the household's recipes. Leaving a household of
        one is a 409.
      responses:
        '200':
          description: The caller's new household of one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/v1/account/export:
    get:
      tags: [account]
      operationId: exportAccount
      x-mcp: false
      summary: Export the caller's data
      description: >
        The caller's personal recipes, meal plans, shopping lists, and meal
        logs as one versioned document (ADR-0011). Library recipes are
        referenced by slug, not included. The response is offered as a
        file download.
      responses:
        '200':
          description: The caller's data in the current export format version.
          headers:
            Content-Disposition:
              description: '`attachment` with a dated file name.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/account/import:
    post:
      tags: [account]
      operationId: importAccount
      x-mcp: false
      summary: Import an export into the caller's (empty) account
      description: >
        Restores a document produced by `exportAccount`, from this or any
        other Mimos instance, into the caller's account. Any format version
        up to the current one is accepted; older ones are upgraded first.
        The account must be empty: no personal recipes or ingredients,
        planned meals, logged meals, or shopping list items. It must also
        be a household of one; a caller who shares a household gets a 409.
        The import is all or nothing.
      requestBody:
        required: true
        description: >
          An `AccountExport` document of any supported version. Declared
          free-form because older versions do not match the current
          schema.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: What was imported, and what could not be.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /api/v1/recipes:
    get:
      tags: [recipes]
      operationId: listMyRecipes
      summary: The personal recipes of the caller's household
      description: >
        Recipes the caller or anyone in their household added (see
        getHousehold); each names who added it in createdBy. Curated
        library recipes are listed by listLibraryRecipes instead.
      parameters:
        - name: q
          in: query
          description: Case-insensitive filter on title, description, tags, and ingredient names.
          schema:
            type: string
      responses:
        '200':
          description: The caller's personal recipes, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [recipes]
      operationId: createRecipe
      summary: Create a personal recipe
      description: >
        Creates a recipe owned by the caller's household, which everyone
        in it can see and change, and returns it with its id.
        Steps are in cooking order. Prefer calculated nutrition: set
        nutritionSource to INGREDIENTS and give each ingredient line the
        catalogSlug of what it is (find slugs with listIngredients, or add
        a missing one with createIngredient), with its amount in g, kg, ml,
        l, tsp, or tbsp, or no unit for a count of pieces, matching the
        entry's basis. A line can instead be one of the caller's own
        recipes (recipeId, from listMyRecipes), measured in servings of it,
        like 2 servings of a focaccia in a sandwich. Put prep like "minced"
        in the line's note, not its name. Check the result first with
        estimateRecipeNutrition. With MANUAL, send per-serving nutrition and
        leave out values you do not know rather than guessing zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: The created recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [recipes]
      operationId: getRecipe
      summary: A recipe the caller may see (their household's or library)
      responses:
        '200':
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [recipes]
      operationId: replaceRecipe
      summary: Replace a personal recipe
      description: >
        Replaces every field, so send the whole recipe (read it first with
        getRecipe and change what you need). Anyone in the household that
        owns the recipe may replace it; curated library recipes are
        read-only. A line may not
        link the recipe itself, or a recipe that already uses it (directly
        or through other recipes): that is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '200':
          description: The replaced recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [recipes]
      operationId: deleteRecipe
      summary: Delete a personal recipe
      description: >
        Deletes one of the household's recipes. Lines of other recipes that
        used it as an ingredient stay, no longer linked, and stop counting
        toward their nutrition.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/recipes/nutrition-estimate:
    post:
      tags: [recipes]
      operationId: estimateRecipeNutrition
      summary: Calculate nutrition for ingredient lines without saving
      description: >
        Runs the calculation a recipe with nutritionSource INGREDIENTS gets:
        each line counts when it has a catalogSlug, an amount, and a unit
        its catalog entry's basis covers (PER_100_G: g, kg; PER_100_ML: ml,
        l, tsp = 5 ml, tbsp = 15 ml; PER_PIECE: no unit), or a recipeId of
        one of the caller's recipes whose nutrition is known, an amount,
        and the unit servings. Returns the per-serving nutrition of the
        lines that counted and each line's status, in order. Nothing is
        saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionEstimateInput'
      responses:
        '200':
          description: The calculated nutrition and each line's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionEstimate'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/ingredients:
    get:
      tags: [recipes]
      operationId: listIngredients
      summary: The ingredients the caller can use
      description: >
        Ingredients with known nutrition: the shared ones everyone on this
        instance sees (isShared) and the caller's own. Link an ingredient
        line to one with its slug (catalogSlug) so a recipe's nutrition
        can be calculated. Each entry's nutrition is for its basis: 100 g,
        100 ml, or one piece. When nothing fits, add one with
        createIngredient.
      parameters:
        - name: q
          in: query
          description: Case-insensitive filter on name and slug.
          schema:
            type: string
      responses:
        '200':
          description: Ingredients, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogIngredient'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [recipes]
      operationId: createIngredient
      summary: Add one of the caller's own ingredients
      description: >
        Adds an ingredient only the caller sees, with its nutrition for a
        basis (per 100 g, per 100 ml, or per piece), usually copied from a
        food label. All four values are required; use 0 when there is
        none. Returns it with a new slug to use as a line's catalogSlug.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '201':
          description: The created ingredient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogIngredient'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/ingredients/{ingredientSlug}:
    parameters:
      - $ref: '#/components/parameters/IngredientSlug'
    put:
      tags: [recipes]
      operationId: replaceIngredient
      summary: Replace one of the caller's own ingredients
      description: >
        Replaces its name, basis, and nutrition. The slug stays, so every
        recipe that uses it is recalculated. Shared ingredients are
        read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '200':
          description: The replaced ingredient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogIngredient'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [recipes]
      operationId: deleteIngredient
      summary: Delete one of the caller's own ingredients
      description: >
        Recipe lines that used it stay, but no longer count toward
        calculated nutrition. Shared ingredients are read-only.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/recipes/library:
    get:
      tags: [recipes]
      operationId: listLibraryRecipes
      summary: The curated recipe library
      parameters:
        - name: q
          in: query
          description: Case-insensitive filter on title, description, tags, and ingredient names.
          schema:
            type: string
      responses:
        '200':
          description: Library recipes, sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/public/recipes:
    get:
      tags: [public]
      operationId: listPublicRecipes
      x-mcp: false
      summary: The curated recipe library (unauthenticated)
      description: >
        Public read access to the library for the SEO recipe pages. Only
        curated recipes are exposed; personal recipes never appear here.
      parameters:
        - name: q
          in: query
          description: Case-insensitive filter on title, description, tags, and ingredient names.
          schema:
            type: string
      responses:
        '200':
          description: Library recipes, sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeSummary'
  /api/v1/public/recipes/{slug}:
    parameters:
      - $ref: '#/components/parameters/RecipeSlug'
    get:
      tags: [public]
      operationId: getPublicRecipe
      x-mcp: false
      summary: A library recipe by slug (unauthenticated)
      responses:
        '200':
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/plans/{startDate}:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
    get:
      tags: [planning]
      operationId: getMealPlan
      summary: The caller's meal plan for a week
      description: >
        Returns the plan for the week starting at `startDate`, which must be
        a Monday. The plan is created empty on first access. Each entry has
        the id that updateMealPlanEntry and deleteMealPlanEntry take.
      responses:
        '200':
          description: The week's plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlan'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/plans/{startDate}/entries:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
    post:
      tags: [planning]
      operationId: addMealPlanEntry
      summary: Plan a meal in the week
      description: >
        Plans a recipe (personal or library, by its id) for a day and meal.
        `startDate` is the week's Monday and `date` must fall within that
        week (Monday to Sunday). A slot can hold more than one recipe.
        Servings may be fractional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanEntryInput'
      responses:
        '201':
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanEntry'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/plans/{startDate}/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
      - $ref: '#/components/parameters/EntryId'
    patch:
      tags: [planning]
      operationId: updateMealPlanEntry
      summary: Change a planned meal's servings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanEntryPatch'
      responses:
        '200':
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanEntry'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [planning]
      operationId: deleteMealPlanEntry
      summary: Remove a planned meal
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/plans/{startDate}/suggestions:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
    get:
      tags: [plugins]
      operationId: getPlanSuggestions
      summary: Suggestion cards for a planned week
      description: >
        Suggestion cards from the instance's plugins (ADR-0006), each
        attributed to its plugin. Cards are advisory and change nothing on
        their own: to apply a card, call addMealPlanEntry once for each of
        its entries, with the entry's date, mealType, recipeId, and
        servings. Only plugins the caller turned on are asked (ADR-0013;
        see listMyPlugins and updateMyPlugin). Returns an empty list when
        the caller turned none on, or all of theirs are unavailable.
      responses:
        '200':
          description: Cards from the caller's healthy plugins, in registration order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSuggestions'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/plans/{startDate}/panels:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
    get:
      tags: [plugins]
      operationId: getWeekPanels
      summary: Plugin panels for a planned week
      description: >
        The week's panels from the plugins the caller turned on that offer
        one (ADR-0017), in registration order. A panel is declarative: a
        summary line for when it is collapsed, then blocks of text,
        highlights, a wheel, and buttons. To press a button, call
        pressWeekPanelAction with the plugin's id and the button's id and
        value. Reading panels changes nothing. A plugin that fails is left
        out; the list is empty when the caller turned none on.
      responses:
        '200':
          description: Panels from the caller's healthy plugins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPanels'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

  /api/v1/plans/{startDate}/panels/{pluginId}/actions:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
      - name: pluginId
        in: path
        required: true
        description: The plugin's manifest id, as in the panel's pluginId.
        schema:
          type: string
    post:
      tags: [plugins]
      operationId: pressWeekPanelAction
      summary: Press a button in a plugin's week panel
      description: >
        Sends one button press to the plugin and returns its panel as it
        is afterwards. Use the id and value of a button from that plugin's
        current panel for the same week (getWeekPanels); what a button does
        is the plugin's to decide and is described by its label and the
        panel's text. Country of the Week, for example, offers spin, then
        choose, skip, or remove for the country the wheel landed on. 404
        when the plugin is not available or the caller has not turned it
        on; 502 when the plugin fails to answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelAction'
      responses:
        '200':
          description: The panel after the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPanel'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'

  /api/v1/plans/{startDate}/shopping-list:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
    get:
      tags: [shopping-lists]
      operationId: getShoppingList
      summary: The shopping list generated for a week
      description: >
        Returns the list as it was last generated, with each item's checked
        state; items not checked are still to buy. 404 when the week's list
        was never generated. The list does not follow later changes to the
        plan; call generateShoppingList to rebuild it.
      responses:
        '200':
          description: The week's shopping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [shopping-lists]
      operationId: generateShoppingList
      summary: Generate (or regenerate) the shopping list for a week
      description: >
        Builds the week's list from its plan: ingredient quantities summed
        across the planned recipes, scaled by planned servings, grouped by
        aisle. Call it after changing the plan. Checked-off items keep their
        checked state when the list is regenerated.
      responses:
        '200':
          description: The generated shopping list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v1/plans/{startDate}/shopping-list/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/PlanWeek'
      - $ref: '#/components/parameters/ShoppingListItemId'
    patch:
      tags: [shopping-lists]
      operationId: updateShoppingListItem
      summary: Check an item off (or back on)
      description: >
        Item ids come from getShoppingList or generateShoppingList. They
        change when the list is regenerated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListItemPatch'
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /api/v1/logs:
    get:
      tags: [logging]
      operationId: listMealLogs
      summary: The caller's meal logs in a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Logs in the range (inclusive), ordered by date and meal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealLog'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
    post:
      tags: [logging]
      operationId: createMealLog
      summary: Log a meal
      description: >
        Either reference a recipe (nutrition is derived from the recipe's
        per-serving values scaled by servings) or log ad-hoc with a
        description and manual nutrition totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealLogInput'
      responses:
        '201':
          description: The created log entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealLog'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/logs/{logId}:
    parameters:
      - $ref: '#/components/parameters/LogId'
    delete:
      tags: [logging]
      operationId: deleteMealLog
      summary: Delete a meal log entry
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/logs/summary:
    get:
      tags: [logging]
      operationId: summarizeMealLogs
      summary: Per-day calorie and macro totals for a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Totals per day in the range (inclusive). Days without logs are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyLogSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'

components:
  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecipeSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    IngredientSlug:
      name: ingredientSlug
      in: path
      required: true
      schema:
        type: string
    PlanWeek:
      name: startDate
      in: path
      required: true
      description: >
        The Monday that starts the planned week, as an ISO date
        (2026-10-05). Any other day is rejected with a 400.
      schema:
        type: string
        format: date
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShoppingListItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An RFC 9457 problem-details error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UserProfile:
      type: object
      description: A Mimos user profile, keyed by the OIDC subject.
      required: [id, subjectId, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Internal profile identifier.
        subjectId:
          type: string
          description: The OIDC subject (`sub`) the profile belongs to.
        displayName:
          type: string
          description: Name shown in the UI; initially the identity provider's username.
        createdAt:
          type: string
          format: date-time
          description: When the profile was created.
    UserPlugin:
      type: object
      description: A plugin available on the instance and whether the caller turned it on (ADR-0013).
      required: [id, name, enabled]
      properties:
        id:
          type: string
          description: The plugin's manifest id.
        name:
          type: string
          description: The plugin's manifest name.
        homepageUrl:
          type: string
          description: The plugin's documentation or project page, from its manifest.
        enabled:
          type: boolean
          description: Whether the caller turned the plugin on. Plugins start off.
    UserPluginSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    Person:
      type: object
      description: A Mimos user as their household sees them.
      required: [id, displayName, you]
      properties:
        id:
          type: string
          format: uuid
          description: The person's profile id.
        displayName:
          type: string
        you:
          type: boolean
          description: True when this is the caller.
    Household:
      type: object
      description: The household the caller belongs to (ADR-0019).
      required: [members]
      properties:
        members:
          type: array
          description: Everyone in the household, by name.
          items:
            $ref: '#/components/schemas/Person'
    HouseholdInvite:
      type: object
      description: A single-use invite to a household.
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: The secret that makes the link `/app/join/{token}`. Shown once; only a hash is stored.
        expiresAt:
          type: string
          format: date-time
    HouseholdInviteToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
    HouseholdInvitePreview:
      type: object
      description: An invite as the person it was given to sees it before joining.
      required: [members, expiresAt, alreadyMember, currentHouseholdShared]
      properties:
        members:
          type: array
          description: Everyone in the inviting household, by name.
          items:
            $ref: '#/components/schemas/Person'
        expiresAt:
          type: string
          format: date-time
        alreadyMember:
          type: boolean
          description: True when the caller is already in the inviting household.
        currentHouseholdShared:
          type: boolean
          description: >
            True when the caller's current household has other members, so
            joining means leaving it and bringing nothing. False when it is
            a household of one, whose recipes and ingredients come along.
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
    Nutrition:
      type: object
      description: Per-serving nutrition for a recipe, or totals for a logged meal. Absent values are unknown, not zero.
      properties:
        calories:
          type: number
          description: Kilocalories.
        proteinG:
          type: number
          description: Protein in grams.
        carbsG:
          type: number
          description: Carbohydrates in grams.
        fatG:
          type: number
          description: Fat in grams.
    IngredientQuantity:
      type: object
      description: 'One ingredient line: an optional amount, an optional unit, and a name.'
      required: [name]
      properties:
        quantity:
          type: number
          description: Amount of the ingredient; omitted for unmeasured ingredients ("salt, to taste"). Positive when present.
        unit:
          type: string
          description: Unit of measure; omitted for countable ingredients ("2 eggs").
        name:
          type: string
          description: Ingredient name as written in the recipe.
        note:
          type: string
          description: Optional prep note shown after the name, like "minced" or "to serve".
        catalogSlug:
          type: string
          description: >
            Slug of the catalog ingredient this line counts as for
            calculated nutrition (see listIngredients); omitted when the
            line is not linked to one. A line links at most one of
            catalogSlug and recipeId.
        recipeId:
          type: string
          format: uuid
          description: >
            Id of one of your household's recipes this line is (see listMyRecipes),
            counted in servings of it (unit `servings`) for calculated
            nutrition, using that recipe's current per-serving nutrition;
            omitted when not linked to a recipe. A line links at most one
            of catalogSlug and recipeId. Library recipes, other households'
            recipes, the recipe itself, and a recipe that already uses this
            one cannot be linked. In an account export it is the `id` of
            another recipe in the same document.
    NutritionSource:
      type: string
      description: >
        Where a recipe's nutrition comes from. MANUAL: the per-serving
        values its author typed. INGREDIENTS: calculated from the linked
        ingredient lines whenever the recipe is read; nutrition sent with
        the recipe is ignored.
      enum: [MANUAL, INGREDIENTS]
    NutritionBasis:
      type: string
      description: >
        The amount a catalog ingredient's nutrition is for: 100 grams, 100
        millilitres, or one piece.
      enum: [PER_100_G, PER_100_ML, PER_PIECE]
    CatalogIngredient:
      type: object
      description: An ingredient with known nutrition for its basis, shared or the caller's own.
      required: [slug, name, basis, nutrition, isShared]
      properties:
        slug:
          type: string
        name:
          type: string
        isShared:
          type: boolean
          description: True for the shared ingredients everyone sees, false for the caller's own.
        basis:
          $ref: '#/components/schemas/NutritionBasis'
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
    IngredientInput:
      type: object
      description: One of the caller's own ingredients as submitted; nutrition needs all four values.
      required: [name, basis, nutrition]
      properties:
        name:
          type: string
        basis:
          $ref: '#/components/schemas/NutritionBasis'
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
    NutritionEstimateInput:
      type: object
      description: The parts of a recipe its calculated nutrition depends on.
      required: [servings, ingredients]
      properties:
        servings:
          type: integer
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientQuantity'
    IngredientLineStatus:
      type: string
      description: >
        Whether an ingredient line counted toward calculated nutrition.
        UNMEASURED: linked but has no amount. NOT_LINKED: neither a
        catalogSlug nor a recipeId. UNIT_NOT_SUPPORTED: linked, but its unit
        does not fit the catalog entry's basis, or a recipe link is not in
        servings. NUTRITION_UNKNOWN: links a recipe whose per-serving
        calories, protein, carbs, or fat are not known (typed nutrition left
        blank, or nothing in it counts), so it adds nothing.
      enum: [COUNTED, UNMEASURED, NOT_LINKED, UNIT_NOT_SUPPORTED, NUTRITION_UNKNOWN]
    NutritionEstimate:
      type: object
      description: Calculated per-serving nutrition, unknown when no line counted.
      required: [nutrition, lines]
      properties:
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
        lines:
          type: array
          description: One status per ingredient line, in the order sent.
          items:
            $ref: '#/components/schemas/IngredientLineStatus'
    RecipeStep:
      type: object
      description: One instruction step; order is significant.
      required: [instruction]
      properties:
        instruction:
          type: string
    RecipeSummary:
      type: object
      description: A recipe as shown in lists and search results.
      required: [id, title, description, servings, isLibrary, tags, nutrition]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Public URL slug; present only for curated library recipes.
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
          description: Number of servings the recipe makes.
        isLibrary:
          type: boolean
          description: True for curated library recipes, false for personal ones.
        createdBy:
          allOf:
            - $ref: '#/components/schemas/Person'
          description: >
            Who added this personal recipe; they may since have left the
            household. Absent for library recipes.
        tags:
          type: array
          items:
            type: string
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
    RecipeDetail:
      type: object
      description: Everything needed to cook a recipe.
      required:
        [id, title, description, servings, isLibrary, tags, nutrition, nutritionSource, ingredients, steps]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Public URL slug; present only for curated library recipes.
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        prepMinutes:
          type: integer
          description: Active preparation time, when known.
        cookMinutes:
          type: integer
          description: Cooking time, when known.
        isLibrary:
          type: boolean
        createdBy:
          allOf:
            - $ref: '#/components/schemas/Person'
          description: >
            Who added this personal recipe; they may since have left the
            household. Absent for library recipes.
        tags:
          type: array
          items:
            type: string
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
        nutritionSource:
          $ref: '#/components/schemas/NutritionSource'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientQuantity'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'
    RecipeInput:
      type: object
      description: A personal recipe as submitted by its author.
      required: [title, description, servings, ingredients, steps, tags, nutrition, nutritionSource]
      properties:
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        prepMinutes:
          type: integer
        cookMinutes:
          type: integer
        tags:
          type: array
          items:
            type: string
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
        nutritionSource:
          $ref: '#/components/schemas/NutritionSource'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientQuantity'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'
    MealType:
      type: string
      description: The meal slots a day is planned in.
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]
    MealPlanEntry:
      type: object
      description: One planned meal in a week.
      required: [id, date, mealType, recipeId, recipeTitle, servings]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
        recipeTitle:
          type: string
          description: Title of the planned recipe at planning time.
        servings:
          type: number
          description: How many servings of the recipe are planned.
    MealPlan:
      type: object
      description: A week of planned meals, keyed by its Monday.
      required: [startDate, entries]
      properties:
        startDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MealPlanEntry'
    MealPlanEntryInput:
      type: object
      required: [date, mealType, recipeId, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
        servings:
          type: number
    MealPlanEntryPatch:
      type: object
      required: [servings]
      properties:
        servings:
          type: number
    PlanSuggestions:
      type: object
      description: Suggestion cards for a week, from the instance's registered plugins (ADR-0006).
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PlanSuggestion'
    PlanSuggestion:
      type: object
      description: One plugin suggestion card, advisory, validated by the server, and attributed to its plugin.
      required: [pluginId, pluginName, title, entries]
      properties:
        pluginId:
          type: string
          description: The plugin's manifest id.
        pluginName:
          type: string
          description: The plugin's manifest name, shown as attribution.
        title:
          type: string
          description: Card headline (at most 80 characters).
        blurb:
          type: string
          description: One-sentence explanation (at most 200 characters).
        icon:
          type: string
          description: Short glyph shown next to the title (at most 8 characters).
        entries:
          type: array
          description: Proposed meals; apply them via the plan-entry endpoint.
          items:
            $ref: '#/components/schemas/PlanSuggestionEntry'
    PlanSuggestionEntry:
      type: object
      description: One proposed meal in a suggestion card.
      required: [date, mealType, recipeId, recipeTitle, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: A curated library recipe (plugins see the library only).
        recipeTitle:
          type: string
          description: Hydrated by the server from its own recipe data.
        servings:
          type: number
    WeekPanels:
      type: object
      description: A week's plugin panels (ADR-0017).
      required: [panels]
      properties:
        panels:
          type: array
          items:
            $ref: '#/components/schemas/WeekPanel'
    WeekPanel:
      type: object
      description: >
        One plugin's panel for a week, validated by the server and
        attributed to its plugin. Render every string as plain text.
      required: [pluginId, pluginName, blocks]
      properties:
        pluginId:
          type: string
          description: The plugin's manifest id.
        pluginName:
          type: string
          description: The plugin's manifest name, shown as attribution.
        summary:
          $ref: '#/components/schemas/PanelSummary'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PanelBlock'
    PanelSummary:
      type: object
      description: The line shown while the panel is collapsed, such as a week's chosen country and its flag.
      required: [label]
      properties:
        icon:
          type: string
          description: A short glyph (at most 8 characters), such as a flag emoji.
        label:
          type: string
          description: At most 60 characters.
    PanelBlock:
      oneOf:
        - $ref: '#/components/schemas/PanelTextBlock'
        - $ref: '#/components/schemas/PanelHighlightBlock'
        - $ref: '#/components/schemas/PanelWheelBlock'
        - $ref: '#/components/schemas/PanelActionsBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/PanelTextBlock'
          highlight: '#/components/schemas/PanelHighlightBlock'
          wheel: '#/components/schemas/PanelWheelBlock'
          actions: '#/components/schemas/PanelActionsBlock'
    PanelTextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
        text:
          type: string
    PanelHighlightBlock:
      type: object
      description: One thing shown large, such as a chosen country.
      required: [type, title]
      properties:
        type:
          type: string
        icon:
          type: string
        title:
          type: string
        text:
          type: string
    PanelWheelBlock:
      type: object
      description: >
        A wheel of 2 to 60 segments. With landing, the wheel spins and stops
        on that segment, and the blocks after it are shown once it stops.
      required: [type, segments]
      properties:
        type:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/PanelWheelSegment'
        landing:
          type: integer
          description: Index into segments of where this spin stops.
    PanelWheelSegment:
      type: object
      required: [label]
      properties:
        label:
          type: string
        icon:
          type: string
    PanelActionsBlock:
      type: object
      description: A row of buttons; press one with pressWeekPanelAction.
      required: [type, actions]
      properties:
        type:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PanelButton'
    PanelButton:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        primary:
          type: boolean
          description: The one button to draw as the main action.
    PanelAction:
      type: object
      description: A button press, the id and value of a button from the plugin's panel.
      required: [id]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
        value:
          type: string
          maxLength: 100
    ShoppingListItem:
      type: object
      description: One aggregated shopping-list line.
      required: [id, name, category, checked]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
        quantity:
          type: number
          description: Total measured amount across the week's recipes, rounded up to whole items for a line without a unit; omitted when every recipe leaves the ingredient unmeasured (ADR-0007).
        category:
          type: string
          description: Aisle grouping (Produce, Meat & Seafood, Dairy & Eggs, ...).
        checked:
          type: boolean
    ShoppingList:
      type: object
      description: A week's shopping list.
      required: [startDate, generatedAt, items]
      properties:
        startDate:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListItem'
    ShoppingListItemPatch:
      type: object
      required: [checked]
      properties:
        checked:
          type: boolean
    MealLog:
      type: object
      description: One logged meal with its calorie/macro totals.
      required: [id, date, mealType, description, servings, nutrition]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: Referenced recipe, when the log came from a recipe.
        description:
          type: string
        servings:
          type: number
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
    MealLogInput:
      type: object
      description: >
        A meal to log. With `recipeId` the nutrition is derived from the
        recipe; otherwise `description` and `nutrition` are required.
      required: [date, mealType]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
        servings:
          type: number
          description: Defaults to 1 when a recipeId is given.
        description:
          type: string
          description: Required for ad-hoc logs; defaults to the recipe title otherwise.
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
          description: Required for ad-hoc logs; ignored when a recipeId is given.
    DailyLogSummary:
      type: object
      description: Calorie and macro totals for one day.
      required: [date, calories, proteinG, carbsG, fatG]
      properties:
        date:
          type: string
          format: date
        calories:
          type: number
        proteinG:
          type: number
        carbsG:
          type: number
        fatG:
          type: number
    AccountExport:
      type: object
      description: >
        One user's data, in export format version 3 (ADR-0011). Any change
        to this schema bumps the version and adds an upgrade step from the
        previous one.
      required: [format, version, exportedAt, ingredients, recipes, mealPlans, shoppingLists, mealLogs]
      properties:
        format:
          type: string
          enum: [mimos.export]
        version:
          type: integer
          description: The format version. This instance exports version 3.
        exportedAt:
          type: string
          format: date-time
        ingredients:
          type: array
          description: The user's own ingredients; recipe lines refer to them by slug.
          items:
            $ref: '#/components/schemas/ExportedIngredient'
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/ExportedRecipe'
        mealPlans:
          type: array
          items:
            $ref: '#/components/schemas/ExportedMealPlan'
        shoppingLists:
          type: array
          items:
            $ref: '#/components/schemas/ExportedShoppingList'
        mealLogs:
          type: array
          items:
            $ref: '#/components/schemas/ExportedMealLog'
    ExportedIngredient:
      type: object
      description: One of the user's own ingredients. `slug` is a key within the document; import assigns a new one.
      required: [slug, name, basis, nutrition]
      properties:
        slug:
          type: string
        name:
          type: string
        basis:
          $ref: '#/components/schemas/NutritionBasis'
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
    ExportedRecipe:
      type: object
      description: >
        A personal recipe. `id` is a key within the document; import assigns
        a new one. A line's recipeId names another recipe in the document
        by this id.
      required:
        [id, title, description, servings, tags, nutrition, nutritionSource, ingredients, steps, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        servings:
          type: integer
        prepMinutes:
          type: integer
        cookMinutes:
          type: integer
        tags:
          type: array
          items:
            type: string
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
        nutritionSource:
          $ref: '#/components/schemas/NutritionSource'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientQuantity'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExportedMealPlan:
      type: object
      description: A week of planned meals, keyed by its Monday.
      required: [startDate, entries]
      properties:
        startDate:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ExportedPlanEntry'
    ExportedPlanEntry:
      type: object
      description: One planned meal. Exactly one of `recipeId` and `librarySlug` is present.
      required: [date, mealType, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: A recipe in this document's `recipes`.
        librarySlug:
          type: string
          description: A curated library recipe, by its public slug.
        servings:
          type: number
    ExportedShoppingList:
      type: object
      description: A week's generated shopping list, as it was when exported.
      required: [startDate, generatedAt, items]
      properties:
        startDate:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExportedShoppingListItem'
    ExportedShoppingListItem:
      type: object
      required: [name, category, checked]
      properties:
        name:
          type: string
        unit:
          type: string
        quantity:
          type: number
          description: Omitted when every recipe leaves the ingredient unmeasured (ADR-0007).
        category:
          type: string
        checked:
          type: boolean
    ExportedMealLog:
      type: object
      description: >
        One logged meal, with the nutrition copied when it was logged. At
        most one of `recipeId` and `librarySlug` is present; neither means
        an ad-hoc meal or one whose recipe was deleted.
      required: [date, mealType, description, servings, nutrition, loggedAt]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: A recipe in this document's `recipes`.
        librarySlug:
          type: string
          description: A curated library recipe, by its public slug.
        description:
          type: string
        servings:
          type: number
        nutrition:
          allOf:
            - $ref: '#/components/schemas/Nutrition'
        loggedAt:
          type: string
          format: date-time
    ImportReport:
      type: object
      description: The outcome of an import.
      required: [sourceVersion, recipes, plannedMeals, shoppingLists, mealLogs, warnings]
      properties:
        sourceVersion:
          type: integer
          description: The format version of the imported document, before any upgrade.
        recipes:
          type: integer
          description: Personal recipes imported.
        plannedMeals:
          type: integer
          description: Planned meals imported.
        shoppingLists:
          type: integer
          description: Shopping lists imported.
        mealLogs:
          type: integer
          description: Logged meals imported.
        warnings:
          type: array
          description: Data that could not be carried over as it was, in plain words.
          items:
            type: string
