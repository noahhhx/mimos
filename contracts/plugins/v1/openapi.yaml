# Mimos plugin extension API, version 1.
#
# The versioned contract a Mimos plugin serves (ADR-0006). Mimos calls out;
# plugins never call back. Additive changes only: new optional fields and
# capabilities may be added to v1; breaking changes get a new version path
# with deprecation notice. The TypeScript types plugins compile against are
# generated from this file into libraries/plugin-sdk (@mimos/plugin-sdk).
openapi: 3.1.0
info:
  title: Mimos Plugin Extension API
  version: 1.1.0
  description: |
    What a Mimos sidecar plugin serves:

    - `GET /manifest` — identity and capabilities, validated by Mimos at
      startup.
    - `POST /v1/plan-suggestions` (capability `plan-suggestions`) — Mimos
      sends a context snapshot (the planned week's shape and the curated
      library catalog) and the plugin responds with declarative suggestion
      cards.
    - `POST /v1/week-panel` (capability `week-panel`, ADR-0017) — Mimos
      asks for a declarative panel for one week, optionally after an action
      the user took on it.

    The model is pull-only: the plugin receives everything it needs in the
    request and never calls Mimos. Context contains curated library recipes
    only — personal recipes contribute their slot shape, never their
    identity or content. Mimos calls a plugin only for households that
    turned it on (any member turns it on for everyone in the household),
    and names each household by a `subject`: a pseudonym that is stable per
    household and plugin, different for every plugin, and unrelated to any
    identity Mimos holds. A user on their own is a household of one. A
    plugin may keep its own data against it.
paths:
  /manifest:
    get:
      operationId: getManifest
      summary: The plugin's identity and capabilities
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginManifest'
  /v1/plan-suggestions:
    post:
      operationId: createPlanSuggestions
      summary: Suggest meals for a planned week
      description: >
        Called by Mimos when a user asks for suggestions. Respond within the
        instance's timeout (default 2s); a failure means the plugin
        contributes nothing for that request — never an error for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionContext'
      responses:
        '200':
          description: Suggestion cards (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSuggestions'
  /v1/week-panel:
    post:
      operationId: renderWeekPanel
      summary: Render a week's panel, after an optional action
      description: >
        Called when a user opens a week's plan (no `action`: render the week
        as it stands and change nothing) and when they press a button in an
        `actions` block (`action` set: act, then render). Respond within the
        instance's timeout (default 2s). Without an action, a failure only
        hides the panel; with one, the user is told it did nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeekPanelRequest'
      responses:
        '200':
          description: The panel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekPanel'
components:
  schemas:
    PluginManifest:
      type: object
      description: Declares the plugin to the instance.
      required: [schema, id, name, version, apiVersions, capabilities]
      properties:
        schema:
          type: string
          enum: [mimos.plugin.manifest/v1]
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: Unique per instance; duplicate ids are a configuration error.
        name:
          type: string
          description: Human-readable name, shown as attribution on cards.
        version:
          type: string
          description: The plugin's own version (not the API version).
        apiVersions:
          type: array
          items:
            type: string
          description: Extension API major versions this plugin speaks.
        capabilities:
          type: array
          items:
            type: string
          description: >
            Capabilities the plugin provides. v1 defines `plan-suggestions`
            and `week-panel`. Unknown capabilities are ignored with a
            warning (a newer plugin on an older core degrades, not fails).
        homepageUrl:
          type: string
          format: uri
          description: Documentation or project page.
    SuggestionContext:
      type: object
      description: Everything the plugin may know about the request.
      required: [weekStartDate, plannedSlots, libraryRecipes]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        weekStartDate:
          type: string
          format: date
          description: The Monday of the week being planned.
        plannedSlots:
          type: array
          description: >
            Meals already in the plan. `recipeId` is present only where the
            planned recipe is itself a library recipe — personal recipes
            contribute their shape, never their identity.
          items:
            $ref: '#/components/schemas/PlannedSlot'
        libraryRecipes:
          type: array
          description: The curated library catalog (the only recipes the plugin sees).
          items:
            $ref: '#/components/schemas/LibraryRecipe'
    PlannedSlot:
      type: object
      required: [date, mealType, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        servings:
          type: number
        recipeId:
          type: string
          format: uuid
    LibraryRecipe:
      type: object
      required: [id, title, tags, servings]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        servings:
          type: integer
    MealType:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]
    PluginSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PluginSuggestionCard'
    PluginSuggestionCard:
      type: object
      description: >
        One suggestion card. Mimos validates every field: title at most 80
        characters (required), blurb at most 200, icon at most 8 (a short
        glyph), at most 5 cards per response and 7 entries per card; each
        entry must fall inside the plan week, use a valid meal type, reference
        a library recipe from the context, and carry servings in (0, 100].
        Invalid entries are dropped; a card left with no entries is dropped.
      required: [title, entries]
      properties:
        title:
          type: string
        blurb:
          type: string
        icon:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedEntry'
    SuggestedEntry:
      type: object
      required: [date, mealType, recipeId, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: Must reference a library recipe from the context.
        servings:
          type: number
    Subject:
      type: string
      format: uuid
      description: >
        The user's household, as a pseudonym: stable for one household and
        one plugin, different for every plugin, unrelated to any identity
        Mimos or its identity provider holds. A user on their own is a
        household of one, so for them it identifies that user; in a shared
        household every member is sent the same subject. Sent with every
        request Mimos makes on a user's behalf (optional on plan-suggestions
        only for older cores).
    WeekPanelRequest:
      type: object
      required: [subject, weekStartDate]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        weekStartDate:
          type: string
          format: date
          description: The Monday of the week the panel is for.
        action:
          $ref: '#/components/schemas/PanelAction'
    PanelAction:
      type: object
      description: >
        A button the user pressed: the `id` and `value` of an action this
        plugin rendered. They pass through the user's browser, so treat them
        as untrusted input.
      required: [id]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
        value:
          type: string
          maxLength: 100
    WeekPanel:
      type: object
      description: >
        A declarative panel, validated by Mimos and rendered as plain text.
        At most 8 blocks. An invalid block, or one of a type this Mimos does
        not know, is dropped; an invalid summary is dropped.
      required: [blocks]
      properties:
        summary:
          $ref: '#/components/schemas/PanelSummary'
        blocks:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/PanelBlock'
    PanelSummary:
      type: object
      description: The line shown while the panel is collapsed.
      required: [label]
      properties:
        icon:
          type: string
          maxLength: 8
          description: A short glyph, such as a flag emoji.
        label:
          type: string
          maxLength: 60
    PanelBlock:
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/HighlightBlock'
        - $ref: '#/components/schemas/WheelBlock'
        - $ref: '#/components/schemas/ActionsBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          highlight: '#/components/schemas/HighlightBlock'
          wheel: '#/components/schemas/WheelBlock'
          actions: '#/components/schemas/ActionsBlock'
    TextBlock:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          maxLength: 280
    HighlightBlock:
      type: object
      description: One thing shown large, such as a chosen country.
      required: [type, title]
      properties:
        type:
          type: string
          enum: [highlight]
        icon:
          type: string
          maxLength: 8
        title:
          type: string
          maxLength: 80
        text:
          type: string
          maxLength: 200
    WheelBlock:
      type: object
      description: >
        A wheel of segments. With `landing`, the wheel spins and stops on
        that segment, and the blocks after it appear once it stops.
      required: [type, segments]
      properties:
        type:
          type: string
          enum: [wheel]
        segments:
          type: array
          minItems: 2
          maxItems: 60
          items:
            $ref: '#/components/schemas/WheelSegment'
        landing:
          type: integer
          minimum: 0
          description: Index into `segments`.
    WheelSegment:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 60
        icon:
          type: string
          maxLength: 8
    ActionsBlock:
      type: object
      description: A row of buttons. Pressing one sends its `id` and `value` back as the request's `action`.
      required: [type, actions]
      properties:
        type:
          type: string
          enum: [actions]
        actions:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/PanelButton'
    PanelButton:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
        label:
          type: string
          maxLength: 40
        value:
          type: string
          maxLength: 100
        primary:
          type: boolean
          description: The one button to draw as the main action.
