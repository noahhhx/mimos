# Mimos plugin extension API — plan-suggestions, version 1.
#
# The versioned contract a Mimos plugin serves (ADR-0006). Mimos calls out;
# plugins never call back. Additive changes only: new optional fields and
# capabilities may be added to v1; breaking changes get a new version path
# with deprecation notice. The TypeScript types plugins compile against are
# generated from this file into libraries/plugin-sdk (@mimos/plugin-sdk).
openapi: 3.1.0
info:
  title: Mimos Plugin Extension API
  version: 1.0.0
  description: |
    What a Mimos sidecar plugin serves:

    - `GET /manifest` — identity and capabilities, validated by Mimos at
      startup.
    - `POST /v1/plan-suggestions` — Mimos sends a context snapshot (the
      planned week's shape and the curated library catalog) and the plugin
      responds with declarative suggestion cards.

    The model is pull-only: the plugin receives everything it needs in the
    request and never calls Mimos. Context contains curated library recipes
    only — personal recipes contribute their slot shape, never their
    identity or content.
paths:
  /manifest:
    get:
      operationId: getManifest
      summary: The plugin's identity and capabilities
      responses:
        '200':
          description: The manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginManifest'
  /v1/plan-suggestions:
    post:
      operationId: createPlanSuggestions
      summary: Suggest meals for a planned week
      description: >
        Called by Mimos when a user asks for suggestions. Respond within the
        instance's timeout (default 2s); a failure means the plugin
        contributes nothing for that request — never an error for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionContext'
      responses:
        '200':
          description: Suggestion cards (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSuggestions'
components:
  schemas:
    PluginManifest:
      type: object
      description: Declares the plugin to the instance.
      required: [schema, id, name, version, apiVersions, capabilities]
      properties:
        schema:
          type: string
          enum: [mimos.plugin.manifest/v1]
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: Unique per instance; duplicate ids are a configuration error.
        name:
          type: string
          description: Human-readable name, shown as attribution on cards.
        version:
          type: string
          description: The plugin's own version (not the API version).
        apiVersions:
          type: array
          items:
            type: string
          description: Extension API major versions this plugin speaks.
        capabilities:
          type: array
          items:
            type: string
          description: >
            Capabilities the plugin provides. v1 defines one:
            `plan-suggestions`. Unknown capabilities are ignored with a
            warning (a newer plugin on an older core degrades, not fails).
        homepageUrl:
          type: string
          format: uri
          description: Documentation or project page.
    SuggestionContext:
      type: object
      description: Everything the plugin may know about the request.
      required: [weekStartDate, plannedSlots, libraryRecipes]
      properties:
        weekStartDate:
          type: string
          format: date
          description: The Monday of the week being planned.
        plannedSlots:
          type: array
          description: >
            Meals already in the plan. `recipeId` is present only where the
            planned recipe is itself a library recipe — personal recipes
            contribute their shape, never their identity.
          items:
            $ref: '#/components/schemas/PlannedSlot'
        libraryRecipes:
          type: array
          description: The curated library catalog (the only recipes the plugin sees).
          items:
            $ref: '#/components/schemas/LibraryRecipe'
    PlannedSlot:
      type: object
      required: [date, mealType, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        servings:
          type: number
        recipeId:
          type: string
          format: uuid
    LibraryRecipe:
      type: object
      required: [id, title, tags, servings]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        servings:
          type: integer
    MealType:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]
    PluginSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PluginSuggestionCard'
    PluginSuggestionCard:
      type: object
      description: >
        One suggestion card. Mimos validates every field: title at most 80
        characters (required), blurb at most 200, icon at most 8 (a short
        glyph), at most 5 cards per response and 7 entries per card; each
        entry must fall inside the plan week, use a valid meal type, reference
        a library recipe from the context, and carry servings in (0, 100].
        Invalid entries are dropped; a card left with no entries is dropped.
      required: [title, entries]
      properties:
        title:
          type: string
        blurb:
          type: string
        icon:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedEntry'
    SuggestedEntry:
      type: object
      required: [date, mealType, recipeId, servings]
      properties:
        date:
          type: string
          format: date
        mealType:
          $ref: '#/components/schemas/MealType'
        recipeId:
          type: string
          format: uuid
          description: Must reference a library recipe from the context.
        servings:
          type: number
