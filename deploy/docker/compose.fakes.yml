# Fakes of third-party services for the agent harness and CI's scenarios,
# never part of the product stack: compose.yml boots without this file, and
# deploy/selfhost never sees it. `harness up` always adds it; without Nix:
#
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.fakes.yml up -d --wait
#
# Each fake's source lives in tools/harness/fakes/<service>/. Their control
# routes (under /_fake/) let a scenario change what a fake serves, so each
# fake publishes its port on 127.0.0.1 only: scenarios reach it there as
# they reach the API, without shelling into a container.
services:
  # intervals.icu (ADR-0022): athlete i1, one good key, and a week of
  # training around today. See tools/harness/fakes/intervals-icu.
  intervals-icu-fake:
    build:
      context: ../..
      dockerfile: tools/harness/fakes/intervals-icu/Dockerfile
    ports:
      - "127.0.0.1:${INTERVALS_ICU_FAKE_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/_fake/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Open Food Facts (ADR-0025): a solid, a drink, and a product without fat
  # by barcode; any other barcode is not found. See
  # tools/harness/fakes/open-food-facts.
  open-food-facts-fake:
    build:
      context: ../..
      dockerfile: tools/harness/fakes/open-food-facts/Dockerfile
    ports:
      - "127.0.0.1:${OPEN_FOOD_FACTS_FAKE_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/_fake/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    environment:
      MIMOS_INTERVALS_ICU_BASE_URL: http://intervals-icu-fake:8080
      MIMOS_OPEN_FOOD_FACTS_BASE_URL: http://open-food-facts-fake:8080
