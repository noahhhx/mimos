name: mimos

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimos}
      POSTGRES_DB: ${POSTGRES_DB:-mimos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/mimos-realm.json:/opt/keycloak/data/import/mimos-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mimos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mimos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mimos}
      # Tokens are issued with the browser-facing issuer (localhost:8081);
      # inside the compose network the JWKS is fetched from the service host.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/mimos
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/mimos/protocol/openid-connect/certs
      MIMOS_SECURITY_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build time (NEXT_PUBLIC_*); a self-hoster overrides these
        # to point the frontend at their own API and Keycloak.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8080}
        NEXT_PUBLIC_KEYCLOAK_AUTHORITY: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}/realms/mimos
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mimos-web}
        NEXT_PUBLIC_APP_URL: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
