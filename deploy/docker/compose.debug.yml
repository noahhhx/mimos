# Debug overlay for the agent harness (docs/harness/) — never part of the
# product stack. Opt in with `harness up --debug`, or without Nix:
#
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.debug.yml up -d --wait
#
# Everything here stays local: step 5 adds debug ports bound to 127.0.0.1.
services:
  api:
    environment:
      # JSON log lines (Elastic Common Schema) with the request ID as a
      # `requestId` field and the access line's details as fields; the
      # default stack keeps human-readable logs.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Diagnostics for `harness diag` and `harness loglevel`. Every actuator
      # endpoint but health already requires a bearer token (SecurityConfig);
      # any valid token will do here. heapdump is deliberately left out: it
      # holds secrets and is large.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,mappings,env,configprops,loggers,metrics,threaddump,flyway
      # Boot masks every env/configprops value by default, which leaves
      # nothing to diagnose; the harness redacts secret-named keys before
      # writing the snapshot instead.
      MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES: always
      MANAGEMENT_ENDPOINT_CONFIGPROPS_SHOW_VALUES: always
      MANAGEMENT_INFO_JAVA_ENABLED: "true"
      MANAGEMENT_INFO_OS_ENABLED: "true"
      MANAGEMENT_INFO_PROCESS_ENABLED: "true"

  postgres:
    # `harness up --debug --sql-log` sets this to 0: every statement is
    # logged with its duration. -1 (the default) logs none.
    command: ["postgres", "-c", "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:--1}"]
