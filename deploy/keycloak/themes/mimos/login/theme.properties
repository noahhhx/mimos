# Mimos login theme: Evening Kitchen (docs/design/index.md, ADR-0010) over
# Keycloak's keycloak.v2 theme. Only the styles change; every template,
# script, and form id comes from the parent.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/mimos.css

# Light only: the app's dark choice is stored on the app's origin, which this
# page cannot read, and the OS setting is not followed (ADR-0008).
darkMode=false
