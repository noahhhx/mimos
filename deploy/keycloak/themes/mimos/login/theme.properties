# Mimos login theme: Evening Kitchen (docs/design/index.md, ADR-0010) over
# Keycloak's keycloak.v2 theme. Only the styles and one script are added;
# every template, upstream script, and form id comes from the parent.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/mimos.css

# Follows the app's light or dark choice, sent on the sign-in request
# (ADR-0021). The template loads it in <head>, so it applies before paint.
scripts=js/theme.js

# PatternFly's dark mode follows the OS setting, which Mimos does not
# (ADR-0008); js/theme.js sets data-theme instead.
darkMode=false
