name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned images (the publish job).
    tags: ['v*']
  pull_request:
  # A dry run of the release: every job, then a signed release APK as a workflow
  # artifact, attached to no release (docs/plans/android-app/16-release.md).
  workflow_dispatch:

concurrency:
  # A manual dry run on main must neither cancel nor be cancelled by a push to it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build and test
        run: ./mvnw -B verify

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install docs tooling
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # The user guide at https://noahhhx.github.io/mimos/, published from main
  # once it builds strictly. Needs the repo's Pages source set to "GitHub
  # Actions" (Settings > Pages).
  pages:
    name: Publish docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  clients:
    name: Generated clients and plugins (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate API client from the spec
        run: npm run generate -w @mimos/api-client

      - name: Regenerate plugin SDK from the spec
        run: npm run generate -w @mimos/plugin-sdk

      - name: Fail on drift between specs and committed generated code
        run: git diff --exit-code -- libraries

      - name: Fail on API contract removals since the last release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No v* tag yet; nothing to compare the API contract against."
            exit 0
          fi
          git show "$tag:contracts/api/openapi.yaml" > "$RUNNER_TEMP/openapi-$tag.yaml"
          node tools/harness/src/contract-additive.ts "$RUNNER_TEMP/openapi-$tag.yaml" contracts/api/openapi.yaml

      - name: Typecheck
        run: |
          npm run typecheck -w @mimos/api-client
          npm run typecheck -w @mimos/plugin-sdk
          npm run typecheck -w @mimos/country-week
          npm run typecheck -w @mimos/harness

      - name: Test reference plugin
        run: npm test -w @mimos/country-week

      - name: Test agent harness
        run: npm test -w @mimos/harness

      - name: Test web app
        run: npm test -w @mimos/web

      - name: Build web app
        run: |
          npm run typecheck -w @mimos/web
          npm run build -w @mimos/web

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Basic is the open-source (MIT) cache; the default provider is proprietary.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install the catalog's Android platform and build tools
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$(version compileSdk)" "build-tools;$(version buildTools)"

      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Main's debug APKs share one key, so testers' installs update over each other.
      # Pull requests keep the SDK's own debug key and never see the secret.
      - name: Unpack the shared debug key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIMOS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::MIMOS_DEBUG_KEYSTORE_BASE64 is not set, so this APK has the SDK's debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
          echo "MIMOS_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.jks" >> "$GITHUB_ENV"

      - name: Check and build
        env:
          MIMOS_DEBUG_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MIMOS_DEBUG_KEYSTORE_PASSWORD || '' }}
          MIMOS_DEBUG_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MIMOS_DEBUG_KEY_ALIAS || '' }}
          MIMOS_DEBUG_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MIMOS_DEBUG_KEY_PASSWORD || '' }}
        run: ./gradlew check assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mimos-debug-apk
          path: apps/mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  compose:
    name: Self-hosted stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate the self-host compose file
        # .env.example leaves the secrets blank on purpose; the file must
        # resolve once they are set.
        env:
          POSTGRES_PASSWORD: ci
          KEYCLOAK_ADMIN_PASSWORD: ci
        run: docker compose -f deploy/selfhost/compose.yml --env-file deploy/selfhost/.env.example config -q

      - name: Boot the stack
        run: docker compose -f deploy/docker/compose.yml up -d --wait

      - name: Smoke test - API health
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Smoke test - migrations applied
        run: |
          rows=$(docker compose -f deploy/docker/compose.yml exec -T postgres \
            psql -U mimos -d mimos -t -A \
            -c "select count(*) from flyway_schema_history where success")
          [ "$rows" -ge 1 ] || { echo "expected applied migrations, got: $rows"; exit 1; }

      - name: Smoke test - Keycloak realm imported
        run: curl -fsS http://localhost:8081/realms/mimos | grep -q '"realm":"mimos"'

      - name: Smoke test - web frontend serves the public page
        run: curl -fsS http://localhost:3000/ | grep -q '<h1>Mimos</h1>'

      - name: Smoke test - web serves its public config from the environment
        run: |
          curl -fsS http://localhost:3000/runtime-config.js \
            | grep -qF '"apiUrl":"http://localhost:8080","oidcAuthority":"http://localhost:8081/realms/mimos"'

      - name: Smoke test - library is seeded and publicly readable
        run: |
          curl -fsS http://localhost:8080/api/v1/public/recipes | grep -q 'fluffy-buttermilk-pancakes'
          curl -fsS http://localhost:8080/api/v1/public/recipes/fluffy-buttermilk-pancakes \
            | grep -q '"title":"Fluffy Buttermilk Pancakes"'

      - name: Smoke test - public recipe page renders server-side
        run: curl -fsS http://localhost:3000/recipes/fluffy-buttermilk-pancakes \
            | grep -q 'Fluffy Buttermilk Pancakes'

      - name: Smoke test - authenticated request reaches protected endpoint
        run: |
          token=$(curl -fsS -X POST http://localhost:8081/realms/mimos/protocol/openid-connect/token \
            -d 'grant_type=password&client_id=mimos-web&username=test&password=mimos-test' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/v1/me | grep -q '"displayName":"test"'
          # Unauthenticated requests must be rejected with problem-details.
          curl -sS http://localhost:8080/api/v1/me -o /dev/null -w '%{http_code} %{content_type}' \
            | grep -qF '401 application/problem+json'

      - name: Smoke test - plugin panel and suggestion end to end
        run: |
          token=$(curl -fsS -X POST http://localhost:8081/realms/mimos/protocol/openid-connect/token \
            -d 'grant_type=password&client_id=mimos-web&username=test&password=mimos-test' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          monday=$(date -d "$(date +%F) - $(( $(date +%u) - 1 )) days" +%F)
          # Plugins are opt-in per user (ADR-0013): turn it on first.
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"enabled":true}' http://localhost:8080/api/v1/me/plugins/country-week
          # Its card follows the week's country (ADR-0017): choose Italy through
          # the week panel, API -> plugin -> SQLite on its volume.
          actions="http://localhost:8080/api/v1/plans/$monday/panels/country-week/actions"
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"id":"choose","value":"IT"}' "$actions" | grep -q '"label":"Italy"'
          # API -> country-week plugin -> validated, attributed card (ADR-0006).
          curl -fsS -H "Authorization: Bearer $token" \
            "http://localhost:8080/api/v1/plans/$monday/suggestions" | grep -q '"pluginId":"country-week"'
          # Leave the week unchosen for the harness scenarios that follow.
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"id":"change"}' "$actions" -o /dev/null

      # Fakes of third-party services for the scenarios (AGENTS.md "Agent
      # harness"). Added only now, so the parity check above runs compose.yml
      # alone. The API restarts to pick up the fakes' base URLs.
      - name: Start the third-party fakes
        run: docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.fakes.yml up -d --wait

      # Browser scenarios (docs/harness/step-6-skill-docs-ci.md). The steps above
      # are the devenv-free self-host parity check; from here on the agent
      # harness runs through devenv, which provides Node and the browsers.
      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install the npm workspace (Playwright) in the devenv shell
        run: devenv shell -- npm ci

      - name: Harness scenarios
        env:
          # Scenarios that reproduce an open bug: they must still fail, and one
          # that passes fails the job until it is removed from this list.
          # Space-separated scenario names; none are open.
          KNOWN_FAILING: ""
        run: |
          failed=0
          for spec in tools/harness/scenarios/*.spec.ts; do
            name=$(basename "$spec" .spec.ts)
            # One run folder for the whole job; the first scenario creates it.
            run=()
            [ -e .harness/runs/latest ] && run=(--run latest)
            if devenv shell -- harness ui "$name" "${run[@]}"; then outcome=passed; else outcome=failed; fi
            if [[ " $KNOWN_FAILING " == *" $name "* ]]; then
              if [ "$outcome" = passed ]; then
                echo "::error::scenario $name passed but is listed in KNOWN_FAILING — remove it from the list"
                failed=1
              else
                echo "::warning::scenario $name failed as expected (KNOWN_FAILING)"
              fi
            elif [ "$outcome" = failed ]; then
              echo "::error::scenario $name failed — see the harness-runs artifact, summary.md first"
              failed=1
            fi
          done
          cat .harness/runs/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - name: Upload harness evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-runs
          # `latest` is a symlink to the run; leave it out so the run is not uploaded twice.
          path: |
            .harness/runs/
            !.harness/runs/latest
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.fakes.yml down -v --remove-orphans

  # Whether a pull request touches anything the Android flows run: the app, the
  # API and what it is built from, the realm, the fakes, the harness, or the
  # web's runtime config, which the app connects with. Pushes and tags always run
  # them, since release-apk and publish wait for them, unless a release skips
  # them (see android-flows).
  changes:
    name: What the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - id: app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo app=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE"
          paths='^(apps/mobile/|apps/api/|apps/web/src/app/runtime-config|core/|integrations/|contracts/|deploy/|plugins/|libraries/test-cases/|tools/harness/|devenv\.|pom\.xml|\.mvn/|package(-lock)?\.json|\.github/workflows/ci\.yml)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          [ "$app" = true ] || echo "::notice::No Android flows: nothing they run changed"

  # Four shards, each with its own stack and emulator, take every fourth flow by
  # name: about 13 minutes of flows each where one job took 43.
  # The stack's images, built once for the four flow shards. Four builds at once
  # each resolved every Maven dependency cold, and Maven Central answered one of
  # them 429 Too Many Requests.
  stack-images:
    name: Stack images for the Android flows
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' && !(startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WITHOUT_ANDROID_FLOWS == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build the images
        run: |
          compose="docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.fakes.yml"
          $compose build
          $compose config --images | grep -v '^postgres:' | xargs docker save | gzip -1 > stack-images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: stack-images
          path: stack-images.tar.gz
          retention-days: 1
          compression-level: 0

  android-flows:
    name: Android flows (emulator, ${{ matrix.shard }}/4)
    needs: [changes, stack-images]
    # A release can go out without them: with the repository variable
    # RELEASE_WITHOUT_ANDROID_FLOWS set to true, a v* tag skips this job, and
    # release-apk and publish run without it. Main always runs it, and a pull
    # request does whenever changes says it touches what the flows run.
    if: ${{ needs.changes.outputs.app == 'true' && !(startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WITHOUT_ANDROID_FLOWS == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      # The emulator needs KVM, and the runner's /dev/kvm is not open to its user.
      - name: Open /dev/kvm to the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml', 'apps/mobile/gradle/libs.versions.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # Basic is the open-source (MIT) cache; the default provider is proprietary.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install the npm workspace in the devenv shell
        run: devenv shell -- npm ci

      # The minified build: the release as R8 shrinks it, so a dependency that
      # needs keep rules fails a flow here rather than the published APK
      # (docs/plans/android-app/19-minified-flows.md).
      - uses: actions/download-artifact@v4
        with:
          name: stack-images

      - name: Load the stack images
        run: gunzip -c stack-images.tar.gz | docker load && rm stack-images.tar.gz

      - name: Boot the stack and the emulator
        timeout-minutes: 25
        run: |
          devenv shell -- harness up --no-build
          devenv shell -- harness mobile up --minified --run latest

      - name: Android flows
        timeout-minutes: 30
        env:
          KNOWN_FAILING: ""
          SHARD: ${{ matrix.shard }}
        run: |
          failed=0
          index=0
          for file in apps/mobile/flows/*.yaml; do
            index=$((index + 1))
            [ $(( (index - 1) % 4 + 1 )) = "$SHARD" ] || continue
            name=$(basename "$file" .yaml)
            if devenv shell -- harness mobile flow "$name" --run latest; then outcome=passed; else outcome=failed; fi
            if [[ " $KNOWN_FAILING " == *" $name "* ]]; then
              if [ "$outcome" = passed ]; then
                echo "::error::flow $name passed but is listed in KNOWN_FAILING; remove it from the list"
                failed=1
              else
                echo "::warning::flow $name failed as expected (KNOWN_FAILING)"
              fi
            elif [ "$outcome" = failed ]; then
              echo "::error::flow $name failed; see the harness-runs-android-$SHARD artifact, summary.md first"
              failed=1
            fi
          done
          exit $failed

      - name: Add the run summary to the job
        if: always()
        run: '[ -f .harness/runs/latest/summary.md ] && cat .harness/runs/latest/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload harness evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-runs-android-${{ matrix.shard }}
          # `latest` is a symlink to the run; leave it out so the run is not uploaded twice.
          # The R8 mapping turns the minified build's stack traces back into names.
          path: |
            .harness/runs/
            !.harness/runs/latest
            apps/mobile/androidApp/build/outputs/mapping/minified/mapping.txt
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          devenv shell -- harness mobile down || true
          docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.fakes.yml down -v --remove-orphans

  # main's app against the last release's published images, the server people
  # still run (docs/plans/android-app/16b-release-skew.md). Only the flows the
  # release already had: one added since may test what the release lacks.
  android-skew:
    name: Android flows against the last release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skips the rest, with a notice, while no release has the mimos-mobile
      # client or the release's images are not published yet.
      - name: Find the last release
        id: release
        run: node tools/harness/src/release.ts pick

      - name: Open /dev/kvm to the runner
        if: steps.release.outputs.tag != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        if: steps.release.outputs.tag != ''

      - uses: cachix/cachix-action@v16
        if: steps.release.outputs.tag != ''
        with:
          name: devenv

      # android-flows saves this cache; restoring it is enough here.
      - uses: nix-community/cache-nix-action@v7
        if: steps.release.outputs.tag != ''
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml', 'apps/mobile/gradle/libs.versions.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Install devenv
        if: steps.release.outputs.tag != ''
        run: nix profile install nixpkgs#devenv

      - uses: gradle/actions/setup-gradle@v6
        if: steps.release.outputs.tag != ''
        with:
          cache-provider: basic

      - name: Install the npm workspace in the devenv shell
        if: steps.release.outputs.tag != ''
        run: devenv shell -- npm ci

      - name: Boot ${{ steps.release.outputs.tag }} and the emulator
        if: steps.release.outputs.tag != ''
        timeout-minutes: 25
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          devenv shell -- harness release up "$TAG"
          devenv shell -- harness mobile up --run latest

      - name: Android flows against ${{ steps.release.outputs.tag }}
        if: steps.release.outputs.tag != ''
        timeout-minutes: 50
        env:
          FLOWS: ${{ steps.release.outputs.flows }}
          # Flows the release had that main changed to test something newer.
          # Space-separated; they must still fail, and empty the list at the
          # next release.
          KNOWN_FAILING: ""
        run: |
          failed=0
          for name in $FLOWS; do
            if devenv shell -- harness mobile flow "$name" --run latest; then outcome=passed; else outcome=failed; fi
            if [[ " $KNOWN_FAILING " == *" $name "* ]]; then
              if [ "$outcome" = passed ]; then
                echo "::error::flow $name passed but is listed in KNOWN_FAILING; remove it from the list"
                failed=1
              else
                echo "::warning::flow $name failed as expected (KNOWN_FAILING)"
              fi
            elif [ "$outcome" = failed ]; then
              echo "::error::flow $name failed against the release; see the harness-runs-android-skew artifact, summary.md first"
              failed=1
            fi
          done
          exit $failed

      - name: Add the run summary to the job
        if: always() && steps.release.outputs.tag != ''
        run: '[ -f .harness/runs/latest/summary.md ] && cat .harness/runs/latest/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload harness evidence
        if: failure() && steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: harness-runs-android-skew
          path: |
            .harness/runs/
            !.harness/runs/latest
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Tear down
        if: always() && steps.release.outputs.tag != ''
        run: |
          devenv shell -- harness mobile down || true
          devenv shell -- harness release down

  # The signed release APK (ADR-0029, docs/plans/android-app/16-release.md):
  # only what passed every job above. A v1.2.3 or v1.2.3-rc.1 tag attaches
  # mimos-<version>.apk and its .sha256 to the tag's GitHub Release; a manual
  # run builds the same from the root pom's version as a workflow artifact.
  release-apk:
    name: Release APK
    # !failure() rather than the default success(), so a skipped android-flows
    # (RELEASE_WITHOUT_ANDROID_FLOWS) does not skip the release.
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !cancelled() && !failure()
    needs: [build, docs, clients, android, compose, android-flows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Basic is the open-source (MIT) cache; the default provider is proprietary.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install the catalog's Android platform and build tools
        run: |
          version() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$(version compileSdk)" "build-tools;$(version buildTools)"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$(version buildTools)" >> "$GITHUB_ENV"

      - name: Unpack the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.MIMOS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MIMOS_RELEASE_KEYSTORE_BASE64 is not set; see docs/plans/android-app/16-release.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MIMOS_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A tag names the version; a manual run builds the root pom's.
      - name: Build the release APK
        env:
          MIMOS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MIMOS_RELEASE_KEYSTORE_PASSWORD }}
          MIMOS_RELEASE_KEY_ALIAS: ${{ secrets.MIMOS_RELEASE_KEY_ALIAS }}
          MIMOS_RELEASE_KEY_PASSWORD: ${{ secrets.MIMOS_RELEASE_KEY_PASSWORD }}
        run: |
          version=()
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version=("-Pmimos.version=${GITHUB_REF_NAME#v}")
          ./gradlew :androidApp:assembleRelease "${version[@]}"

      - name: Verify, name, and checksum the APK
        id: apk
        run: |
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          version=$("$BUILD_TOOLS/aapt2" dump badging "$apk" | sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::the APK is version '$version', not the tag's"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/mimos-$version.apk"
          (cd "$RUNNER_TEMP/release" && sha256sum "mimos-$version.apk" > "mimos-$version.apk.sha256")
          cp androidApp/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/mapping.txt"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: mimos-${{ steps.apk.outputs.version }}-apk
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

      # Reads a stack trace from this build back into the source's names.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mimos-${{ steps.apk.outputs.version }}-mapping
          path: ${{ runner.temp }}/mapping.txt
          retention-days: 90
          if-no-files-found: error

      # Converges on a rerun: the release is made once and the files replaced.
      - name: Attach to the tag's GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            prerelease=()
            [[ "$VERSION" == *-rc.* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Mimos $VERSION" \
              --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$RUNNER_TEMP/release/mimos-$VERSION.apk" "$RUNNER_TEMP/release/mimos-$VERSION.apk.sha256"

  # Images for self-hosting (ADR-0012, deploy/selfhost): only what passed
  # every job above. main publishes `main` and `sha-<commit>`; a release tag
  # v1.2.3 publishes `1.2.3`, `1.2` and `latest`.
  publish:
    name: Publish images (${{ matrix.image }})
    # On a tag, the APK must be released first: servers that upgrade to these
    # images tell their apps a newer one is out. release-apk skips on main.
    if: github.event_name == 'push' && !cancelled() && !failure()
    needs: [build, docs, clients, android, compose, android-flows, release-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mimos-api
            dockerfile: apps/api/Dockerfile
          - image: mimos-web
            dockerfile: apps/web/Dockerfile
          - image: mimos-keycloak
            dockerfile: deploy/keycloak/Dockerfile
          - image: mimos-country-week
            dockerfile: plugins/country-week/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # A release tag's version, so getInstance answers it (ADR-0029); main stays a snapshot.
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            MIMOS_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
