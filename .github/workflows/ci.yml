name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned images (the publish job).
    tags: ['v*']
  pull_request:
  # A dry run of the release: every job, then a signed release APK as a workflow
  # artifact, attached to no release (docs/harness/releasing.md).
  workflow_dispatch:

concurrency:
  # A manual dry run on main must neither cancel nor be cancelled by a push to it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Each area's jobs live in their own workflow; this file runs them all as one
# run and gates the release on them. A called workflow gets at most the
# permissions its caller grants here, and secrets only where inherited.
jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  typescript:
    name: TypeScript
    uses: ./.github/workflows/typescript.yml

  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  dependency-graph:
    name: Dependency graph
    uses: ./.github/workflows/dependency-graph.yml
    permissions:
      contents: write

  selfhost:
    name: Self-hosted stack
    uses: ./.github/workflows/selfhost.yml

  android:
    name: Android
    uses: ./.github/workflows/android.yml
    secrets: inherit

  android-skew:
    name: Android against the last release
    needs: [android]
    uses: ./.github/workflows/android-skew.yml

  release:
    name: Release
    # !failure() rather than the default success(), so a skipped android-flows
    # (RELEASE_WITHOUT_ANDROID_FLOWS) does not skip the release.
    if: github.event_name != 'pull_request' && !cancelled() && !failure()
    needs: [backend, typescript, docs, selfhost, android]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
