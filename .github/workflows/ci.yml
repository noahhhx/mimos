name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build and test
        run: ./mvnw -B verify

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install docs tooling
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

  client:
    name: API client (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate API client from the spec
        run: npm run generate -w @mimos/api-client

      - name: Fail on drift between spec and committed client
        run: git diff --exit-code -- libraries

      - name: Typecheck
        run: npm run typecheck -w @mimos/api-client

      - name: Build web app
        run: |
          npm run typecheck -w @mimos/web
          npm run build -w @mimos/web

  compose:
    name: Self-hosted stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Boot the stack
        run: docker compose -f deploy/docker/compose.yml up -d --wait

      - name: Smoke test - API health
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Smoke test - migrations applied
        run: |
          rows=$(docker compose -f deploy/docker/compose.yml exec -T postgres \
            psql -U mimos -d mimos -t -A \
            -c "select count(*) from flyway_schema_history where success")
          [ "$rows" -ge 1 ] || { echo "expected applied migrations, got: $rows"; exit 1; }

      - name: Smoke test - Keycloak realm imported
        run: curl -fsS http://localhost:8081/realms/mimos | grep -q '"realm":"mimos"'

      - name: Smoke test - web frontend serves the public page
        run: curl -fsS http://localhost:3000/ | grep -q '<h1>Mimos</h1>'

      - name: Smoke test - library is seeded and publicly readable
        run: |
          curl -fsS http://localhost:8080/api/v1/public/recipes | grep -q 'fluffy-buttermilk-pancakes'
          curl -fsS http://localhost:8080/api/v1/public/recipes/fluffy-buttermilk-pancakes \
            | grep -q '"title":"Fluffy Buttermilk Pancakes"'

      - name: Smoke test - public recipe page renders server-side
        run: curl -fsS http://localhost:3000/recipes/fluffy-buttermilk-pancakes \
            | grep -q 'Fluffy Buttermilk Pancakes'

      - name: Smoke test - authenticated request reaches protected endpoint
        run: |
          token=$(curl -fsS -X POST http://localhost:8081/realms/mimos/protocol/openid-connect/token \
            -d 'grant_type=password&client_id=mimos-web&username=test&password=mimos-test' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/v1/me | grep -q '"displayName":"test"'
          # Unauthenticated requests must be rejected with problem-details.
          curl -sS http://localhost:8080/api/v1/me -o /dev/null -w '%{http_code} %{content_type}' \
            | grep -q '401 application/problem\\+json'

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/compose.yml down -v --remove-orphans
