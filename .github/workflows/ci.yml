name: CI

on:
  push:
    branches: [main]
    # Release tags publish versioned images (the publish job).
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build and test
        run: ./mvnw -B verify

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install docs tooling
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # The user guide at https://noahhhx.github.io/mimos/, published from main
  # once it builds strictly. Needs the repo's Pages source set to "GitHub
  # Actions" (Settings > Pages).
  pages:
    name: Publish docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  clients:
    name: Generated clients and plugins (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate API client from the spec
        run: npm run generate -w @mimos/api-client

      - name: Regenerate plugin SDK from the spec
        run: npm run generate -w @mimos/plugin-sdk

      - name: Fail on drift between specs and committed generated code
        run: git diff --exit-code -- libraries

      - name: Typecheck
        run: |
          npm run typecheck -w @mimos/api-client
          npm run typecheck -w @mimos/plugin-sdk
          npm run typecheck -w @mimos/country-week
          npm run typecheck -w @mimos/harness

      - name: Test reference plugin
        run: npm test -w @mimos/country-week

      - name: Test agent harness
        run: npm test -w @mimos/harness

      - name: Test web app
        run: npm test -w @mimos/web

      - name: Build web app
        run: |
          npm run typecheck -w @mimos/web
          npm run build -w @mimos/web

  compose:
    name: Self-hosted stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Validate the self-host compose file
        # .env.example leaves the secrets blank on purpose; the file must
        # resolve once they are set.
        env:
          POSTGRES_PASSWORD: ci
          KEYCLOAK_ADMIN_PASSWORD: ci
        run: docker compose -f deploy/selfhost/compose.yml --env-file deploy/selfhost/.env.example config -q

      - name: Boot the stack
        run: docker compose -f deploy/docker/compose.yml up -d --wait

      - name: Smoke test - API health
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Smoke test - migrations applied
        run: |
          rows=$(docker compose -f deploy/docker/compose.yml exec -T postgres \
            psql -U mimos -d mimos -t -A \
            -c "select count(*) from flyway_schema_history where success")
          [ "$rows" -ge 1 ] || { echo "expected applied migrations, got: $rows"; exit 1; }

      - name: Smoke test - Keycloak realm imported
        run: curl -fsS http://localhost:8081/realms/mimos | grep -q '"realm":"mimos"'

      - name: Smoke test - web frontend serves the public page
        run: curl -fsS http://localhost:3000/ | grep -q '<h1>Mimos</h1>'

      - name: Smoke test - web serves its public config from the environment
        run: |
          curl -fsS http://localhost:3000/runtime-config.js \
            | grep -qF '"apiUrl":"http://localhost:8080","oidcAuthority":"http://localhost:8081/realms/mimos"'

      - name: Smoke test - library is seeded and publicly readable
        run: |
          curl -fsS http://localhost:8080/api/v1/public/recipes | grep -q 'fluffy-buttermilk-pancakes'
          curl -fsS http://localhost:8080/api/v1/public/recipes/fluffy-buttermilk-pancakes \
            | grep -q '"title":"Fluffy Buttermilk Pancakes"'

      - name: Smoke test - public recipe page renders server-side
        run: curl -fsS http://localhost:3000/recipes/fluffy-buttermilk-pancakes \
            | grep -q 'Fluffy Buttermilk Pancakes'

      - name: Smoke test - authenticated request reaches protected endpoint
        run: |
          token=$(curl -fsS -X POST http://localhost:8081/realms/mimos/protocol/openid-connect/token \
            -d 'grant_type=password&client_id=mimos-web&username=test&password=mimos-test' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/v1/me | grep -q '"displayName":"test"'
          # Unauthenticated requests must be rejected with problem-details.
          curl -sS http://localhost:8080/api/v1/me -o /dev/null -w '%{http_code} %{content_type}' \
            | grep -qF '401 application/problem+json'

      - name: Smoke test - plugin suggestion appears end to end
        run: |
          token=$(curl -fsS -X POST http://localhost:8081/realms/mimos/protocol/openid-connect/token \
            -d 'grant_type=password&client_id=mimos-web&username=test&password=mimos-test' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          monday=$(date -d "$(date +%F) - $(( $(date +%u) - 1 )) days" +%F)
          # Plugins are opt-in per user (ADR-0013): turn it on first.
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"enabled":true}' http://localhost:8080/api/v1/me/plugins/country-week
          # API -> country-week plugin -> validated, attributed card (ADR-0006).
          curl -fsS -H "Authorization: Bearer $token" \
            "http://localhost:8080/api/v1/plans/$monday/suggestions" | grep -q '"pluginId":"country-week"'

      # Browser scenarios (docs/harness/step-6-skill-docs-ci.md). The steps above
      # are the devenv-free self-host parity check; from here on the agent
      # harness runs through devenv, which provides Node and the browsers.
      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install the npm workspace (Playwright) in the devenv shell
        run: devenv shell -- npm ci

      - name: Harness scenarios
        env:
          # Scenarios that reproduce an open bug: they must still fail, and one
          # that passes fails the job until it is removed from this list.
          # Space-separated scenario names; none are open.
          KNOWN_FAILING: ""
        run: |
          failed=0
          for spec in tools/harness/scenarios/*.spec.ts; do
            name=$(basename "$spec" .spec.ts)
            # One run folder for the whole job; the first scenario creates it.
            run=()
            [ -e .harness/runs/latest ] && run=(--run latest)
            if devenv shell -- harness ui "$name" "${run[@]}"; then outcome=passed; else outcome=failed; fi
            if [[ " $KNOWN_FAILING " == *" $name "* ]]; then
              if [ "$outcome" = passed ]; then
                echo "::error::scenario $name passed but is listed in KNOWN_FAILING — remove it from the list"
                failed=1
              else
                echo "::warning::scenario $name failed as expected (KNOWN_FAILING)"
              fi
            elif [ "$outcome" = failed ]; then
              echo "::error::scenario $name failed — see the harness-runs artifact, summary.md first"
              failed=1
            fi
          done
          cat .harness/runs/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - name: Upload harness evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-runs
          # `latest` is a symlink to the run; leave it out so the run is not uploaded twice.
          path: |
            .harness/runs/
            !.harness/runs/latest
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker/compose.yml down -v --remove-orphans

  # Images for self-hosting (ADR-0012, deploy/selfhost): only what passed
  # every job above. main publishes `main` and `sha-<commit>`; a release tag
  # v1.2.3 publishes `1.2.3`, `1.2` and `latest`.
  publish:
    name: Publish images (${{ matrix.image }})
    if: github.event_name == 'push'
    needs: [build, docs, clients, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mimos-api
            dockerfile: apps/api/Dockerfile
          - image: mimos-web
            dockerfile: apps/web/Dockerfile
          - image: mimos-keycloak
            dockerfile: deploy/keycloak/Dockerfile
          - image: mimos-country-week
            dockerfile: plugins/country-week/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
