version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to nixpkgs' playwright-driver; bump both together (AGENTS.md).
      - dependency-name: "@playwright/test"
      # TypeScript 7 ships no JavaScript compiler API, which openapi-ts and
      # Next.js load. Wait until both support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/mobile
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /deploy/keycloak
      - /plugins/country-week
      - /tools/harness/fakes/intervals-icu
      - /tools/harness/fakes/open-food-facts
    schedule:
      interval: weekly
    ignore:
      # Image runtimes track the toolchain CI builds with: Java 21 (ADR-0001)
      # and Node 22. Move them together on purpose, not from a weekly bump.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - /deploy/docker
      - /deploy/selfhost
    schedule:
      interval: weekly
    ignore:
      # A Postgres major version cannot open the previous one's data
      # directory; self-hosters need an upgrade path first.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
